<!DOCTYPE html>
<html lang="en" class="foo lightest bar">
    <head>
        <meta charset="utf-8" />
        <meta name="color-scheme" content="dark light" />
        <title>Eclipse | Testing</title>
        <script type="importmap">
            {
                "imports": {
                    "lit": "../node_modules/lit/index.js",
                    "lit/decorators.js": "../node_modules/lit/decorators.js",
                    "lit-element/": "../node_modules/lit-element/",
                    "lit-html": "../node_modules/lit-html/lit-html.js",
                    "lit-html/": "../node_modules/lit-html/",
                    "@lit/reactive-element": "../node_modules/@lit/reactive-element/reactive-element.js",
                    "@lit/reactive-element/": "../node_modules/@lit/reactive-element/"
                }
            }
        </script>
        <style>
            /* Leave room for the native dropdown and targets for focus/leave tests. */
            body { margin: 2rem; }
            #after { display: block; margin-top: 15rem; }
        </style>
    </head>
    <body>
        <button id="before">Before the picker</button>
        <ce-eclipse>
            Default themes
        </ce-eclipse>
        <button id="after">After the picker</button>
        <script>
            // Keep one component per page because each instance controls <html>.
            // Query parameters let this page serve several browser test scenarios.
            const params = new URLSearchParams(location.search);
            const eclipse = document.querySelector('ce-eclipse');

            if (params.get('themes') === 'custom') {
                eclipse.setAttribute('themes', JSON.stringify([
                    {label: '東京', className: 'tokyo'},
                    {label: '大阪', className: 'osaka'},
                ]));
                document.documentElement.className = 'foo osaka bar';
            }
            if (params.has('disable-preview')) {
                eclipse.setAttribute('disable-preview', '');
            }
            if (params.get('initial') === 'none') {
                document.documentElement.className = 'foo bar';
            }
            // Playwright supplies setup before parsing, so attributes/properties
            // are configured before Lit upgrades the element and snapshots them.
            const setup = window.eclipseTestSetup;
            if (setup) {
                document.documentElement.className = setup.initialClasses;
                if ('themes' in setup) eclipse.themes = setup.themes;
                if ('themesAttribute' in setup) eclipse.setAttribute('themes', setup.themesAttribute);
                if ('disablePreviewAttribute' in setup) {
                    eclipse.setAttribute('disable-preview', setup.disablePreviewAttribute);
                }
                if ('label' in setup) eclipse.textContent = setup.label;
                if ('labelMarkup' in setup) eclipse.innerHTML = setup.labelMarkup;
            }
        </script>
        <script type="module">
            await import('../dist/eclipse.js');
            try {
                await document.querySelector('ce-eclipse').updateComplete;
                window.eclipseReady = {error: null};
            } catch (error) {
                // Invalid setup is an expected assertion target in configuration
                // tests. All other browser errors are captured by the test fixture.
                window.eclipseReady = {error: {name: error.name, message: error.message}};
            }
        </script>
    </body>
</html>
